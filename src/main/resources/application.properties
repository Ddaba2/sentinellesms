spring.application.name=SentinelleSMS

# Server
server.port=${SERVER_PORT:8081}

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sentinellesms}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# JWT
sentinellesms.jwt.secret=${JWT_SECRET:changeme-super-secret-key-for-dev-only-please-override-in-prod-min-32-bytes}
sentinellesms.jwt.access-token-expiration-ms=${JWT_ACCESS_EXP_MS:900000}
sentinellesms.jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXP_MS:2592000000}

# CORS
sentinellesms.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Rate limiting (endpoints publics uniquement)
sentinellesms.ratelimit.capacity=${RATE_LIMIT_CAPACITY:20}
sentinellesms.ratelimit.window-seconds=${RATE_LIMIT_WINDOW_SECONDS:60}

# Default admin seed
sentinellesms.admin.username=${ADMIN_USERNAME:admin}
sentinellesms.admin.email=${ADMIN_EMAIL:admin@sentinellesms.local}
sentinellesms.admin.password=${ADMIN_PASSWORD:ChangeMe123!}
